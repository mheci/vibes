---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: vibes
description: Aurora NVIDIA Open KDE workstation image built with BlueBuild.

base-image: ghcr.io/ublue-os/aurora-nvidia-open
image-version: stable

modules:
  - type: script
    scripts:
      - setup-repos-and-rpms.sh

  - type: script
    scripts:
      - setup-extra-themes.sh

  - type: script
    scripts:
      - setup-cachyos-kernel.sh

  - type: script
    scripts:
      - build-scx.sh

  - type: script
    scripts:
      - install-themes.sh

  - type: script
    scripts:
      - build-gnome-boxes.sh

  - type: script
    scripts:
      - build-scx-manager.sh

  - type: script
    scripts:
      - build-klassy.sh

  - type: script
    scripts:
      - install-latest-apps.sh

  - type: script
    scripts:
      - strip-build-tools.sh

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - verify-system-files.sh

  - type: default-flatpaks
    configurations:
      - install:
          # Bazaar: modern app store
          - io.github.kolunmi.Bazaar
          # FlameGet: GTK4 download manager (aria2/cURL/yt-dlp wrapper)
          - io.github.C_Yassin.FlameGet
          # Warehouse: Flatpak manager and cleaner
          - io.github.flattool.Warehouse
          # coppwr: PipeWire graph inspection and control
          - io.github.dimtpap.coppwr
          # DistroShelf: graphical interface for managing Distrobox containers
          - com.ranfdev.DistroShelf
          # Lobjur: native Lobsters and Hacker News client
          - com.ranfdev.Lobjur
          # adw-gtk: GTK3 theme matching libadwaita (light/dark/black variants
          # are all shipped inside this single theme package)
          - org.gtk.Gtk3theme.adw-gtk3
          # Tangram: browser for the Web (Sonny Piers' recommended install)
          - re.sonny.Tangram
          # Folio: markdown notebook for elementary OS (Toolstack's recommended install)
          - com.toolstack.Folio
          # karere: WhatsApp Web client for Linux, Gtk4 + Libadwaita
          - io.github.tobagin.karere
          # Varia: download manager supporting regular downloads, torrents and videos
          - io.github.giantpinkrobots.varia
          # AdwSteamGtk: Steam library browser using the libadwaita design language
          - io.github.Foldex.AdwSteamGtk
          # Pods: manage Podman and Docker containers
          - com.github.marhkb.Pods
          # Bottles: run Windows games and apps using Wine
          - com.usebottles.bottles
          # Flatseal: manage Flatpak permissions
          - com.github.tchx84.Flatseal
          # ProtonPlus: Proton and Wine-GE version manager for gaming
          - com.vysp3r.ProtonPlus
          # Foliate: modern ebook reader
          - com.github.johnfactotum.Foliate
          # Equibop: Discord fork with open-source patches
          - org.equicord.equibop
          # Ente Auth: end-to-end encrypted authenticator
          - io.ente.auth
          # Ignition: manage Flatpak remotes and files
          - io.github.flattool.Ignition
          # Constrict: GTK4 audio recording app for podcasts
          - io.github.wartybix.Constrict
          # RustConn: GTK4 SSH/RDP connection manager (developer recommends Flatpak)
          - io.github.totoshko88.RustConn
          # Memento: movie watchlist and play tracker (no native package
          # exists; the developer ships it on Flathub)
          - io.github.ans_ibrahim.Memento

  - type: kargs
    kargs:
      # Disable NVMe autonomous power-state transitions (audio/video stutter)
      - nvme_core.default_ps_max_latency_us=0
      # Disable watchdog timers (gaming-oriented images)
      - nowatchdog
      # Disable split lock detection and mitigation (stutter/audio crackle on
      # CPUs that busy-loop on split locks, e.g. older Intel)
      - split_lock_detect=off

  - type: containerfile
    snippets:
      - RUN bootc container lint
