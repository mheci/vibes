# Vibes gaming-focused WirePlumber policy.
# Consolidated into a single node.rules array to avoid override behavior
# where multiple node.rules definitions in the same file overwrite each other,
# and separate files defining node.rules could clobber each other.

node.rules = [
  # High priority for physical outputs (keep audio path responsive)
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        priority.driver = 900
        priority.session = 900
      }
    }
  }

  # Raise priority for common game audio clients so they don't get starved.
  {
    matches = [
      { application.name = "~.*Steam.*|.*steam.*|.*Game.*|.*game.*" }
      { application.name = "~.*Discord.*|.*discord.*|.*Mumble.*|.*TeamSpeak.*|.*teamspeak.*|.*Element.*|.*vesktop.*" }
      { application.name = "~.*OBS.*|.*obs.*|.*firefox.*|.*zen.*|.*helium.*|.*brave.*|.*chrom.*|.*Brave.*" }
    ]
    actions = {
      update-props = {
        priority.session = 800
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }

  # Ensure capture nodes (microphones) stay alive for voice chat and RNNoise.
  {
    matches = [
      { media.class = "Audio/Source" }
      { node.name = "~vibes_rnnoise.*|~capture.vibes.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Link policy: auto-connect everything by default for convenience.
link.policy = {
  auto-link = true
}
