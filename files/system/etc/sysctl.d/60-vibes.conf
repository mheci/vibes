# Vibes sysctl tuning

# --- VM ---
# Low swappiness: prefer cache reclaim over swap (swap is zram/zswap, which
# is only used as a safety net)
vm.swappiness=10
vm.page-cluster=0
vm.vfs_cache_pressure=50
vm.dirty_ratio=10
vm.dirty_background_ratio=5
# Games and editors with large mapped regions (e.g. modded games)
vm.max_map_count=1048576

# --- File watchers (games, IDEs, Flatpak runtimes) ---
fs.inotify.max_user_watches=524288
fs.inotify.max_user_instances=1024

# --- Networking: BBR3 congestion control + fq qdisc ---
# tcp_bbr3 is autoloaded via modules-load.d/60-vibes-bbr3.conf
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr3

# --- Misc ---
kernel.core_uses_pid=1
