# Vibes media/gaming PipeWire defaults.
# 48 kHz is required by RNNoise and is a safe baseline for games, Discord, OBS, and browsers.
# Quantum settings balance low latency (gaming) with stability (media production).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
    default.clock.quantum-limit = 8192
    # Disable unnecessary processing for lowest possible latency path
    link.max-buffers            = 16
    mem.warn-mlock              = false
    mem.allow-mlock             = true
    core.daemon                 = true
    core.name                   = pipewire-0
}

# RT scheduling and RNNoise filter-chain modules.
# Consolidated into a single file to avoid PipeWire conf.d override behavior
# where separate files defining context.modules would overwrite each other.
context.modules = [
    # Load the RT module with aggressive but safe priorities for gaming.
    { name = libpipewire-module-rt
      args = {
          nice.level    = -11
          rt.prio       = 88
          rt.time.soft  = 200000
          rt.time.hard  = 200000
      }
      flags = [ ifexists nofail ]
    }

    # RNNoise virtual microphone using werman/noise-suppression-for-voice.
    # Stereo label requested by image owner. Use "Vibes RNNoise Stereo Source" in apps.
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Vibes RNNoise Stereo Source"
        media.name       = "Vibes RNNoise Stereo Source"
        filter.graph = {
          nodes = [
            {
              type   = ladspa
              name   = rnnoise
              plugin = /usr/lib64/ladspa/librnnoise_ladspa.so
              label  = noise_suppressor_stereo
              control = {
                "VAD Threshold (%)"        = 70.0
                "VAD Grace Period (ms)"    = 200
                "Retroactive VAD Grace (ms)" = 0
              }
            }
          ]
        }
        capture.props = {
          node.name    = "capture.vibes_rnnoise_source"
          node.passive = true
          audio.rate   = 48000
          audio.channels = 2
        }
        playback.props = {
          node.name    = "vibes_rnnoise_source"
          media.class  = Audio/Source
          audio.rate   = 48000
          audio.channels = 2
        }
      }
    }
]
