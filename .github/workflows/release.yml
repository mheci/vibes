name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | head -n2 | tail -n1 || echo '')"
          if [[ -z "$PREV_TAG" ]]; then
            NOTES="Initial release ${GITHUB_REF_NAME}"
          else
            NOTES="## Changes since ${PREV_TAG}\\n\\n"
            NOTES+="$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --oneline --no-decorate)"
          fi
          {
            echo "notes<<DELIM"
            echo -e "${NOTES}"
            echo "DELIM"
          } >> "${GITHUB_OUTPUT}"

      - name: Install cosign
        run: |
          curl -fsSL -o /tmp/cosign.tar.gz \
            https://github.com/sigstore/cosign/releases/download/v2.6.4/cosign-linux-amd64.tar.gz
          tar -xzf /tmp/cosign.tar.gz -C /tmp
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Verify image signature and capture digest
        id: verify
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository_owner }}/vibes:latest"
          cosign verify --key cosign.pub --output /tmp/payload.json "${IMAGE}"
          DIGEST="$(jq -r '.critical.image.docker-manifest-digest' /tmp/payload.json)"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Verified ${IMAGE} (${DIGEST}) with cosign.pub"

      - name: Generate SBOM for the image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/vibes:latest
          artifact-name: vibes-sbom
          format: spdx-json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: true

      - name: Download SBOM
        id: download
        uses: actions/download-artifact@v8.0.1
        with:
          name: vibes-sbom

      - name: Attest SBOM with cosign
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          echo "${{ secrets.SIGNING_SECRET }}" > "${KEY_FILE}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/vibes:latest"
          SBOM_FILE="$(find "${{ steps.download.outputs.download-path }}" -name '*.spdx.json' | head -n1)"
          if [[ -z "${SBOM_FILE}" ]]; then
            echo "::error::SPDX SBOM not found in download path"
            exit 1
          fi
          COSIGN_PASSWORD="" cosign attest --key "${KEY_FILE}" \
            --type spdx --predicate "${SBOM_FILE}" "${IMAGE}"
          rm -f "${KEY_FILE}"
          echo "Attested SBOM for ${IMAGE}"

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: |
            ${{ steps.notes.outputs.notes }}

            ## Artifact

            - Image: `ghcr.io/${{ github.repository_owner }}/vibes:latest`
            - Digest: `${{ steps.verify.outputs.digest }}`
            - SBOM: attached (`vibes-sbom.spdx.json`)
            - SBOM attestation: attached to the image with cosign
            - Signature: verified against `cosign.pub` (see [README](README.md))
          files: ${{ steps.download.outputs.download-path }}/*
          generate_release_notes: false
          make_latest: true
